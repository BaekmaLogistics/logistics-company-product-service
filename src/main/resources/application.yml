spring:
  application:
    name: logistics-company-product-service
  #  profiles:
  #    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        impl.uuid_binary_compatibility: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis 설정, Redis 사용하지 않을 시 주석처리
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 3000
            logger-level: basic
            error-decoder: com.sparta.logistics.infrastructure.feign.decoder.FeignErrorDecoder

#포트 번호 설정
server:
  port: ${SERVER_PORT}

hub:
  service:
    url: ${HUB_SERVICE_URL}

user:
  service:
    url: ${USER_SERVICE_URL}

message:
  exchange: baekma.exchange # Producer만 적용
  queue:
    delivery: delivery.queue
    hub: hub.queue
    notification: notification.queue

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /api/api-spec
    enabled: true
  swagger-ui:
    path: /api/api-docs
    enabled: true
  override-with-generic-response: false
  use-fqn: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    io.lettuce.core: DEBUG
    org.springframework.data.redis: DEBUG

resilience4j:
  retry:
    instances:
      hubClient:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - com.sparta.logistics.infrastructure.feign.exception.FeignApiException